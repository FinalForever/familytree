services:
  familytree:
    # 直接拉取 GitHub 预构建镜像，无需本地打包（amd64 / arm64 均可）
    image: ghcr.io/finalforever/familytree:latest
    # 如改了源码想自行构建：删掉上面一行，取消下面四行注释，并把 up 命令换成 docker compose up -d --build
    # build:
    #   context: .
    #   args:
    #     NEXT_PUBLIC_REQUIRE_AUTH: "true"
    #     NEXT_PUBLIC_FAMILY_NAME: "白"
    container_name: familytree
    restart: unless-stopped
    ports:
      # 只绑本机回环：默认经反向代理/隧道对外提供 HTTPS，不要把明文 HTTP 端口直接暴露到公网；
      # 确需局域网直连时再改成 "3000:3000"，并自行加一层 HTTPS 反代
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3000
      - CONFIG_DIR=/app/config
      - DATA_DIR=/app/data
      - REQUIRE_AUTH=true
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-true}   # 注册开关：默认开放；在 .env 或环境里设为 false 后重启容器即强制关闭（压过后台设置，已有账号不受影响）
      # —— 密钥参数看这里（小白版说明）——
      # AUTH_SECRET（会话签名密钥）和 ADMIN_PASSWORD（管理后台口令）这两个必填项，
      # 默认写在同目录的 .env 文件里（把 .env.local.example 复制为 .env 再改值即可）。
      # 如果你不想用 .env，也可以把下面两行最前面的「#」删掉、直接把值写在本文件里：
      # 本文件中 environment 的值优先于 .env，写在这里后，.env 里的同名项就不用管了。
      # - AUTH_SECRET=换成你的随机长字符串（至少 16 位，终端运行 openssl rand -hex 32 可生成）
      # - ADMIN_PASSWORD=换成你的管理员口令（登录 /admin 后台用，不填则后台登不进去）
    # 以下为容器加固：只读根文件系统、去掉全部 capabilities、禁止提权、资源上限
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# 可选：如需让其他容器按容器名 familytree:3000 访问本服务（例如与反向代理或隧道容器同网），
# 可把下面 networks 段的注释去掉，并给上面的 service 增加 networks 配置：
#    networks:
#      - default
#      - panel
#
# networks:
#   panel:
#     external: true
#     name: your-network-name
