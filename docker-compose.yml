services:
  familytree:
    build:
      context: .
      args:
        NEXT_PUBLIC_REQUIRE_AUTH: "true"
        NEXT_PUBLIC_FAMILY_NAME: "白"
    container_name: familytree
    restart: unless-stopped
    # 不映射宿主机端口：对外只走 Cloudflare Tunnel（经 1panel-network 按容器名 familytree:3000 直达）
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - default
      - panel
    env_file:
      - .env
    environment:
      - PORT=3000
      - CONFIG_DIR=/app/config
      - DATA_DIR=/app/data
      - REQUIRE_AUTH=true
      - REGISTRATION_OPEN=true   # 注册开关：true 开放邮箱注册；改为 false 后重启容器即关闭注册（已有账号不受影响）
    # 以下为容器加固：只读根文件系统、去掉全部 capabilities、禁止提权、资源上限
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # 与 1Panel 的 cloudflared 容器同网：Cloudflare Tunnel 的服务地址填 http://familytree:3000 即可直达
  panel:
    external: true
    name: 1panel-network
