name: 构建 iOS 未签名 IPA

# 族谱编写 App 的 iOS 壳（ios-app/）：在 GitHub 免费 macOS 机器上免签名构建，
# 产出未签名 IPA 供自行签名侧载。手动触发，或推 ios-* / app-v* 标签时触发
# （现有 Docker 工作流只认 v* 标签，互不冲突）。
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"
      - "app-v*"

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 免签名构建（iphoneos / Release）
        run: |
          xcodebuild \
            -project ios-app/FamilyTreeEditor/FamilyTreeEditor.xcodeproj \
            -scheme FamilyTreeEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA（Payload 结构）
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FamilyTreeEditor.app"
          test -d "$APP_PATH"
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry ../dist/FamilyTreeEditor-unsigned.ipa Payload)
          unzip -l dist/FamilyTreeEditor-unsigned.ipa | head -20

      - name: 保留构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTreeEditor-unsigned-ipa
          path: dist/FamilyTreeEditor-unsigned.ipa
          if-no-files-found: error

      - name: 挂到该标签的 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          case "$TAG" in
            ios-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "族谱编写 iOS 未签名 IPA：下载 FamilyTreeEditor-unsigned.ipa 后自行签名侧载。" $PRERELEASE_FLAG
          fi
          gh release upload "$TAG" dist/FamilyTreeEditor-unsigned.ipa --clobber
